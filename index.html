<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Sholat</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root {
    --ink: #0f1117;
    --paper: #f5f0e8;
    --gold: #c8963e;
    --gold-light: #e8c97a;
    --teal: #1a5c5a;
    --teal-light: #2d8c89;
    --muted: #7a7060;
    --card-bg: rgba(255,255,255,0.55);
    --border: rgba(200,150,62,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 60% at 10% 0%, rgba(26,92,90,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 100%, rgba(200,150,62,0.14) 0%, transparent 60%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8963e' fill-opacity='0.04'%3E%3Cpath d='M30 0l5 10 11 1.6-8 7.8 1.9 11L30 25l-9.9 5.4 1.9-11-8-7.8L25 10z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.7s ease both;
  }

  .header-arabic {
    font-family: 'Amiri', serif;
    font-size: 2rem;
    color: var(--teal);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .header-title {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 24px;
    animation: fadeDown 0.7s 0.1s ease both;
    z-index: 100;
  }

  .search-input {
    width: 100%;
    padding: 14px 50px 14px 18px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    backdrop-filter: blur(8px);
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus {
    border-color: var(--teal-light);
    box-shadow: 0 0 0 3px rgba(45,140,137,0.12);
  }

  .search-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--teal);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .search-btn:hover { background: var(--teal-light); transform: translateY(-50%) scale(1.07); }

  /* Suggestions dropdown */
  .suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(15,17,23,0.12);
    z-index: 999;
    animation: fadeIn 0.18s ease;
    max-height: 280px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .suggestion-item {
    padding: 12px 18px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .suggestion-item:hover, .suggestion-item.focused { background: rgba(26,92,90,0.06); }
  .suggestion-item:not(:last-child) { border-bottom: 1px solid rgba(200,150,62,0.12); }
  .suggestion-prov {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .search-status {
    font-size: 0.72rem;
    color: var(--muted);
    padding: 4px 6px 0;
    text-align: right;
  }

  /* Location badge */
  .location-badge {
    position: relative;
    border-radius: 18px;
    margin-bottom: 24px;
    overflow: hidden;
    border: 1.5px solid var(--border);
    animation: fadeIn 0.4s ease both;
    min-height: 160px;
  }
  .location-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(0.38) saturate(0.7);
    transition: opacity 0.6s ease;
  }
  .location-bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(15,17,23,0.15) 0%,
      rgba(26,92,90,0.55) 40%,
      rgba(15,17,23,0.85) 100%
    );
  }
  .location-content {
    position: relative;
    z-index: 1;
    padding: 18px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100%;
  }
  .location-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .location-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--gold-light);
    box-shadow: 0 0 0 3px rgba(232,201,122,0.3);
    flex-shrink: 0;
  }
  .location-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    flex: 1;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    letter-spacing: 0.03em;
  }
  .location-province {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-light);
    opacity: 0.9;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .location-desc {
    font-size: 0.78rem;
    line-height: 1.55;
    color: rgba(255,255,255,0.78);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .location-wiki-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    transition: color 0.2s;
    align-self: flex-start;
  }
  .location-wiki-link:hover { color: var(--gold-light); }
  .location-sub { display: none; }

  /* Date strip */
  .date-strip {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    overflow-x: auto;
    scrollbar-width: none;
    animation: fadeIn 0.5s 0.1s ease both;
  }
  .date-strip::-webkit-scrollbar { display: none; }
  .date-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--ink);
    white-space: nowrap;
  }
  .date-btn.active {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
    font-weight: 600;
  }
  .date-btn:hover:not(.active) { border-color: var(--teal-light); color: var(--teal); }

  /* Active prayer card */
  .next-prayer-card {
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
    border-radius: 22px;
    padding: 28px 28px 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    animation: slideUp 0.6s 0.15s ease both;
  }
  .next-prayer-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
  }
  .next-prayer-card::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 40px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  .next-label {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    margin-bottom: 6px;
  }
  .next-prayer-name {
    font-family: 'Amiri', serif;
    font-size: 2.4rem;
    color: #fff;
    line-height: 1;
    margin-bottom: 4px;
  }
  .next-prayer-time {
    font-size: 3.2rem;
    font-weight: 300;
    color: #fff;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 16px;
  }
  .next-countdown {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.9);
  }

  /* Prayer grid */
  .prayers-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: slideUp 0.6s 0.25s ease both;
  }

  .prayer-card {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    gap: 16px;
    backdrop-filter: blur(8px);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    cursor: default;
  }
  .prayer-card:hover {
    transform: translateY(-2px);
    border-color: rgba(200,150,62,0.45);
    box-shadow: 0 6px 20px rgba(15,17,23,0.07);
  }
  .prayer-card.active-prayer {
    border-color: var(--gold);
    background: rgba(200,150,62,0.08);
    box-shadow: 0 0 0 3px rgba(200,150,62,0.12);
  }

  .prayer-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .prayer-icon svg {
    width: 20px; height: 20px;
  }

  .prayer-info { flex: 1; }
  .prayer-name-en {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .prayer-name {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--ink);
  }

  .prayer-time {
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--teal);
    letter-spacing: -0.5px;
  }
  .prayer-card.active-prayer .prayer-time { color: var(--gold); font-weight: 500; }

  .active-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 3px rgba(200,150,62,0.25);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  /* Date header */
  .date-header {
    text-align: center;
    margin-bottom: 20px;
    animation: fadeIn 0.4s ease both;
  }
  .date-main {
    font-family: 'Amiri', serif;
    font-size: 1.5rem;
    color: var(--teal);
  }
  .date-hijri {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }

  /* State: loading / empty */
  .state-msg {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    animation: fadeIn 0.4s ease;
  }
  .state-msg svg { margin-bottom: 12px; opacity: 0.4; }
  .state-msg p { font-size: 0.9rem; }

  .divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 24px 0;
    position: relative;
  }
  .divider-line {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .divider-line::before, .divider-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(200,150,62,0.6), transparent);
  }
  .divider-ornament {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--gold);
    font-size: 1rem;
    letter-spacing: 0.08em;
  }
  .divider-arabic {
    font-family: 'Amiri', serif;
    font-size: 1.15rem;
    color: var(--gold);
    text-align: center;
    line-height: 1.4;
    opacity: 0.85;
  }
  .divider-label {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
  }

  /* Music player floating */
  .music-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    background: rgba(26,92,90,0.92);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(200,150,62,0.3);
    border-radius: 50px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    animation: slideUp 0.5s ease both;
    min-width: 220px;
  }
  .music-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
  }
  .music-info {
    flex: 1;
    overflow: hidden;
  }
  .music-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .music-sub {
    font-size: 0.62rem;
    color: rgba(255,255,255,0.5);
  }
  .music-wave {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 16px;
  }
  .music-wave span {
    display: block;
    width: 2.5px;
    border-radius: 2px;
    background: var(--gold-light);
    animation: wave 1s ease-in-out infinite;
  }
  .music-wave span:nth-child(1) { height: 6px;  animation-delay: 0s; }
  .music-wave span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
  .music-wave span:nth-child(3) { height: 8px;  animation-delay: 0.3s; }
  .music-wave span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
  .music-wave span:nth-child(5) { height: 5px;  animation-delay: 0.6s; }
  .music-wave.paused span { animation-play-state: paused; }
  @keyframes wave {
    0%,100% { transform: scaleY(1); }
    50%      { transform: scaleY(0.3); }
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid rgba(26,92,90,0.2);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-wrap { text-align: center; padding: 40px; }

  /* Footer */
  .footer {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .footer-ornament {
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.7;
  }
  .footer-arabic {
    font-family: 'Amiri', serif;
    font-size: 1.1rem;
    color: var(--teal);
    opacity: 0.75;
  }
  .footer-sub {
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.8;
  }
  .footer-sub a {
    color: var(--teal-light);
    text-decoration: none;
  }
  .footer-sub a:hover { text-decoration: underline; }

  /* Animations */
  @keyframes fadeDown { from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px rgba(200,150,62,0.25); }
    50% { box-shadow: 0 0 0 6px rgba(200,150,62,0.1); }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-arabic">الصَّلَاةُ خَيْرٌ مِنَ النَّوْمِ</div>
    <div class="header-title">Jadwal Waktu Sholat</div>
  </div>

  <!-- Search -->
  <div class="search-wrap" id="searchWrap">
    <input type="text" class="search-input" id="searchInput"
      placeholder="Cari kota / kabupaten..." autocomplete="off" />
    <button class="search-btn" id="searchBtn">
      <i data-lucide="search" style="width:16px;height:16px;stroke:#fff;stroke-width:2.5"></i>
    </button>
    <div class="suggestions" id="suggestions" style="display:none"></div>
  </div>
  <div class="search-status" id="searchStatus"></div>

  <!-- Location badge -->
  <div class="location-badge" id="locationBadge" style="display:none">
    <div class="location-bg" id="locationBg"></div>
    <div class="location-bg-overlay"></div>
    <div class="location-content">
      <div class="location-top">
        <div class="location-dot"></div>
        <div class="location-name" id="locationName">—</div>
        <div class="location-province" id="locationProvince"></div>
      </div>
      <div class="location-desc" id="locationDesc"></div>
      <a class="location-wiki-link" id="locationWikiLink" href="#" target="_blank">
        <i data-lucide="external-link" style="width:10px;height:10px;stroke:currentColor;stroke-width:2"></i>
        Wikipedia
      </a>
    </div>
    <div class="location-sub" id="locationSub"></div>
  </div>

  <!-- Date strip -->
  <div class="date-strip" id="dateStrip" style="display:none"></div>

  <!-- Main content -->
  <div id="mainContent">
    <div class="state-msg">
      <i data-lucide="map-pin" style="width:48px;height:48px;stroke:var(--teal);opacity:0.35;margin-bottom:12px;display:block;margin-inline:auto"></i>
      <p>Masukkan nama kota untuk melihat jadwal sholat</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-ornament">
      <i data-lucide="moon" style="width:11px;height:11px;stroke:var(--gold);fill:var(--gold);fill-opacity:0.35;stroke-width:1.5"></i>
      <i data-lucide="star" style="width:7px;height:7px;stroke:var(--gold);fill:var(--gold);stroke-width:1.5"></i>
      <i data-lucide="moon" style="width:11px;height:11px;stroke:var(--gold);fill:var(--gold);fill-opacity:0.35;stroke-width:1.5"></i>
    </div>
    <div class="footer-arabic">كورنياوان ساتريا</div>
    <div class="footer-sub">dibuat dengan ❤️ oleh <a href="https://instagram.com/krniwnstria" target="_blank">Kurniawan Satria</a> &nbsp;·&nbsp; data dari <a href="https://api.myquran.com" target="_blank">myquran.com</a></div>
  </footer>

</div>

<!-- Audio -->
<audio id="bgAudio" loop preload="auto">
  <source src="https://github.com/KurniawanSatria/Muslim/raw/refs/heads/main/yaleel%20yaleel.mp3" type="audio/mpeg">
</audio>

<!-- Floating music bar -->
<div class="music-bar" id="musicBar" style="display:none">
  <button class="music-btn" id="musicToggle" title="Play/Pause">
    <i data-lucide="pause" id="musicIcon" style="width:18px;height:18px;stroke:var(--gold-light);stroke-width:2"></i>
  </button>
  <div class="music-info">
    <div class="music-title">Ya Leel Ya Leel</div>
    <div class="music-sub">Nasheed · loop</div>
  </div>
  <div class="music-wave" id="musicWave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<script>
const API_BASE = 'https://api.myquran.com/v3';
// CORS proxies — dicoba berurutan sampai berhasil
const PROXIES = [
  url => url,                                                    // direct
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
];

async function apiFetch(path) {
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(API_BASE + path), { signal: AbortSignal.timeout(7000) });
      if (res.ok) return res;
    } catch(e) { /* coba proxy berikutnya */ }
  }
  throw new Error('Semua proxy gagal');
}

let currentKota = null;
let currentDate = todayStr();
let countdownInterval = null;
let allKota = [];

const PRAYERS = [
  { key:'subuh',   name:'Subuh',   en:'Fajr',    bg:'rgba(26,92,90,0.1)',     icon:'moon',        color:'#1a5c5a' },
  { key:'dzuhur',  name:'Dzuhur',  en:'Dhuhr',   bg:'rgba(200,150,62,0.12)',  icon:'sun',         color:'#c8963e' },
  { key:'ashar',   name:'Ashar',   en:'Asr',     bg:'rgba(230,160,40,0.12)',  icon:'sun-medium',  color:'#e0960a' },
  { key:'maghrib', name:'Maghrib', en:'Maghrib', bg:'rgba(200,80,60,0.1)',    icon:'sunset',      color:'#c85040' },
  { key:'isya',    name:'Isya',    en:'Isha',    bg:'rgba(60,60,130,0.1)',    icon:'star',        color:'#4040aa' },
];

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Load semua kota saat init ──────────────────────────────────────
async function loadAllKota() {
  const status = document.getElementById('searchStatus');
  const input  = document.getElementById('searchInput');
  input.placeholder = 'Memuat daftar kota...';
  input.disabled = true;
  try {
    const res  = await apiFetch('/sholat/kabkota/semua');
    const data = await res.json();
    allKota = data.data || [];
    input.placeholder = `Cari dari ${allKota.length} kota / kabupaten...`;
    input.disabled = false;
    input.focus();
    status.textContent = `✓ ${allKota.length} kota tersedia`;
    setTimeout(() => status.textContent = '', 3500);
  } catch(e) {
    input.placeholder = 'Gagal memuat kota — coba refresh halaman';
    input.disabled = false;
    status.textContent = '⚠ Gagal terhubung ke API';
  }
}

// ── Wikipedia city info ────────────────────────────────────────────
// Mapping nama kota API → judul artikel Wikipedia Indonesia
const WIKI_TITLES = {
  'JAKARTA'   : 'Jakarta',
  'SURABAYA'  : 'Surabaya',
  'BANDUNG'   : 'Bandung',
  'MEDAN'     : 'Medan',
  'SEMARANG'  : 'Semarang',
  'YOGYAKARTA': 'Daerah Istimewa Yogyakarta',
  'JOGJA'     : 'Daerah Istimewa Yogyakarta',
  'MAKASSAR'  : 'Makassar',
  'PALEMBANG' : 'Palembang',
  'PEKANBARU' : 'Pekanbaru',
  'DENPASAR'  : 'Denpasar',
  'BALI'      : 'Bali',
  'MALANG'    : 'Kota Malang',
  'BOGOR'     : 'Kota Bogor',
  'DEPOK'     : 'Kota Depok',
  'TANGERANG' : 'Kota Tangerang',
  'BEKASI'    : 'Kota Bekasi',
  'ACEH'      : 'Banda Aceh',
  'LOMBOK'    : 'Lombok',
  'MANADO'    : 'Manado',
  'PONTIANAK' : 'Pontianak',
  'SAMARINDA' : 'Samarinda',
  'BALIKPAPAN': 'Balikpapan',

  'SERANG'    : 'Serang',
  'BATAM'     : 'Batam',
};

const FALLBACK_GRADIENTS = [
  'linear-gradient(160deg,#0d3320,#1a5c5a)',
  'linear-gradient(160deg,#1a2a3a,#2d5a6b)',
  'linear-gradient(160deg,#2a1a10,#6b3a1a)',
  'linear-gradient(160deg,#1a1a2a,#3a2d6b)',
  'linear-gradient(160deg,#0d2020,#1a4040)',
];

async function loadCityInfo(lokasi) {
  const bg    = document.getElementById('locationBg');
  const desc  = document.getElementById('locationDesc');
  const wlink = document.getElementById('locationWikiLink');
  const prov  = document.getElementById('locationProvince');
  if (!bg) return;

  // Reset bersih — hanya pakai backgroundImage, JANGAN pakai background shorthand
  bg.removeAttribute('style');
  bg.style.position = 'absolute';
  bg.style.inset = '0';
  bg.style.backgroundSize = 'cover';
  bg.style.backgroundPosition = 'center';
  bg.style.transition = 'filter 0.6s ease';
  bg.style.backgroundImage = 'none';
  bg.style.filter = 'none';
  desc.textContent = '';
  wlink.style.display = 'none';
  if (prov) prov.textContent = '';

  const upper = lokasi.toUpperCase();
  let wikiTitle = Object.entries(WIKI_TITLES).find(([k]) => upper.includes(k))?.[1];
  if (!wikiTitle) {
    wikiTitle = lokasi
      .replace(/^(KOTA|KABUPATEN|KAB\.?)\s+/i, '')
      .split(' ')
      .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
      .join(' ');
  }

  // Gradient sementara selagi fetch
  const idx = lokasi.charCodeAt(0) % FALLBACK_GRADIENTS.length;
  bg.style.backgroundImage = FALLBACK_GRADIENTS[idx];

  try {
    const url = `https://id.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();

    // Gambar — coba hi-res dulu, fallback ke thumbnail asli
    const imgUrl = data.thumbnail?.source || data.originalimage?.source;
    if (imgUrl) {
      const hiRes = imgUrl.replace(/\/\d+px-/, '/800px-');
      const tryLoad = (src) => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = reject;
        img.src = src;
      });

      const src = await tryLoad(hiRes).catch(() => tryLoad(imgUrl)).catch(() => null);
      if (src) {
        bg.style.backgroundImage = `url('${src}')`;
        bg.style.filter = 'brightness(0.55) saturate(0.75)';
      }
    }

    // Deskripsi
    if (data.extract) {
      const clean = data.extract.replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
      desc.textContent = clean.length > 220 ? clean.slice(0, 220).replace(/\s\S+$/, '') + '…' : clean;
    }

    // Deskripsi singkat (kota/provinsi)
    if (data.description && prov) prov.textContent = data.description;

    // Link Wikipedia
    if (data.content_urls?.desktop?.page) {
      wlink.href = data.content_urls.desktop.page;
      wlink.style.display = 'inline-flex';
      lucide.createIcons({ nodes: [wlink] });
    }

  } catch(e) {
    desc.textContent = `${lokasi} — data Wikipedia tidak tersedia.`;
  }
}
function filterKota(q) {
  const norm = q.toLowerCase().replace(/\s+/g,' ').trim();
  return allKota.filter(k =>
    k.lokasi.toLowerCase().includes(norm)
  ).slice(0, 8);
}

// ── Event listeners pencarian ──────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim();
  if (q.length < 1) { hideSuggestions(); return; }
  if (!allKota.length) return;
  const results = filterKota(q);
  showSuggestions(results, q);
});

document.getElementById('searchBtn').addEventListener('click', () => {
  const q = document.getElementById('searchInput').value.trim();
  if (!allKota.length || !q) return;
  const results = filterKota(q);
  showSuggestions(results, q);
});

document.addEventListener('click', e => {
  if (!document.getElementById('searchWrap').contains(e.target)) hideSuggestions();
});

// ── Keyboard navigation ───────────────────────────────────────────
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  const box = document.getElementById('suggestions');
  if (box.style.display === 'none') return;
  const items = box.querySelectorAll('.suggestion-item');
  let idx = [...items].findIndex(el => el.classList.contains('focused'));
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    items.forEach(el => el.classList.remove('focused'));
    idx = (idx + 1) % items.length;
    items[idx]?.classList.add('focused');
    items[idx]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    items.forEach(el => el.classList.remove('focused'));
    idx = (idx - 1 + items.length) % items.length;
    items[idx]?.classList.add('focused');
    items[idx]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    const focused = box.querySelector('.suggestion-item.focused');
    if (focused) focused.click();
    else if (items.length === 1) items[0].click();
  } else if (e.key === 'Escape') {
    hideSuggestions();
  }
});

function highlightMatch(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0, idx) +
    `<mark style="background:rgba(200,150,62,0.3);border-radius:3px;padding:0 1px">${text.slice(idx, idx+q.length)}</mark>` +
    text.slice(idx + q.length);
}

function showSuggestions(items, q='') {
  const box = document.getElementById('suggestions');
  if (!items.length) {
    box.innerHTML = `<div class="suggestion-item" style="color:var(--muted);cursor:default">Kota tidak ditemukan</div>`;
    box.style.display = 'block';
    return;
  }
  box.innerHTML = items.map(item => `
    <div class="suggestion-item" data-id="${item.id}" data-lokasi="${item.lokasi}">
      <span>${highlightMatch(item.lokasi, q)}</span>
    </div>`).join('');
  box.querySelectorAll('.suggestion-item[data-id]').forEach(el => {
    el.addEventListener('click', () => selectCity({ id: el.dataset.id, lokasi: el.dataset.lokasi }));
  });
  box.style.display = 'block';
}

function hideSuggestions() {
  const box = document.getElementById('suggestions');
  box.style.display = 'none';
  box.querySelectorAll('.suggestion-item').forEach(el => el.classList.remove('focused'));
}

function selectCity(item) {
  currentKota = item;
  currentDate = todayStr();
  document.getElementById('searchInput').value = item.lokasi;
  hideSuggestions();
  document.getElementById('searchStatus').textContent = '';

  const badge = document.getElementById('locationBadge');
  badge.style.display = 'block';
  badge.style.animation = 'fadeIn 0.3s ease both';
  document.getElementById('locationName').textContent = item.lokasi;
  document.getElementById('locationSub').textContent = `Kode: ${item.id}`;
  loadCityInfo(item.lokasi);

  buildDateStrip();
  loadSchedule();
}

// ── Date strip ─────────────────────────────────────────────────────
function buildDateStrip() {
  const strip = document.getElementById('dateStrip');
  strip.style.display = 'flex';
  strip.innerHTML = '';
  const today = new Date();
  [-1, 0, 1, 2, 3].forEach(offset => {
    const d = new Date(today);
    d.setDate(today.getDate() + offset);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const btn = document.createElement('button');
    btn.className = 'date-btn' + (ds === currentDate ? ' active' : '');
    const dn = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    btn.textContent = offset === 0 ? 'Hari Ini' : `${dn[d.getDay()]} ${d.getDate()}`;
    btn.onclick = () => {
      currentDate = ds;
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadSchedule();
    };
    strip.appendChild(btn);
  });
}

// ── Load jadwal ────────────────────────────────────────────────────
async function loadSchedule() {
  if (!currentKota) return;
  const content = document.getElementById('mainContent');
  content.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
  try {
    const isToday = currentDate === todayStr();
    const path = isToday
      ? `/sholat/jadwal/${currentKota.id}/today?tz=Asia%2FJakarta`
      : `/sholat/jadwal/${currentKota.id}/${currentDate}`;
    const res  = await apiFetch(path);
    const data = await res.json();

    // Struktur: data.data.jadwal["YYYY-MM-DD"] = { subuh, dzuhur, ... }
    let jadwal = null;
    const raw = data?.data?.jadwal;

    if (raw && typeof raw === 'object') {
      // Cek apakah nested by date key (misal: { "2026-03-08": { subuh:... } })
      const keys = Object.keys(raw);
      if (keys.length > 0 && typeof raw[keys[0]] === 'object' && 'subuh' in raw[keys[0]]) {
        jadwal = raw[keys[0]]; // ambil value dari date key pertama
      } else if ('subuh' in raw) {
        jadwal = raw; // flat langsung
      }
    }

    if (!jadwal) {
      console.error('Struktur API tidak dikenali:', JSON.stringify(data).slice(0, 500));
      content.innerHTML = `<div class="state-msg"><p>Format data tidak dikenali.<br><small style="opacity:.6">Lihat console untuk detail.</small></p></div>`;
      return;
    }

    renderSchedule(jadwal, isToday);
  } catch(e) {
    content.innerHTML = '<div class="state-msg"><p>Gagal memuat data. Periksa koneksi internet.</p></div>';
  }
}

// ── Helpers ────────────────────────────────────────────────────────
function parseTime(t) {
  const [h,m] = t.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0); return d;
}
function getNextPrayer(jadwal) {
  const now = new Date();
  for (const p of PRAYERS) {
    const t = jadwal[p.key];
    if (t && typeof t === 'string' && t.includes(':')) {
      const dt = parseTime(t);
      if (dt > now) return { ...p, time: t, dt };
    }
  }
  // Semua waktu sudah lewat → tampilkan Subuh (besok)
  const subuhTime = jadwal.subuh || jadwal.imsak || '—';
  return { ...PRAYERS[0], time: subuhTime, dt: null, note: 'besok' };
}
function getActivePrayer(jadwal) {
  const now = new Date();
  let last = null;
  for (const p of PRAYERS) {
    const t = jadwal[p.key];
    if (t && typeof t === 'string' && t.includes(':') && parseTime(t) <= now) last = p.key;
  }
  return last;
}
function formatCountdown(dt) {
  if (!dt) return '';
  const diff = dt - new Date();
  if (diff <= 0) return 'Sekarang';
  const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
  if (h > 0) return `${h}j ${m}m lagi`;
  if (m > 0) return `${m}m ${s}s lagi`;
  return `${s}s lagi`;
}

// ── Render ─────────────────────────────────────────────────────────
function renderSchedule(jadwal, isToday) {
  clearInterval(countdownInterval);
  const content = document.getElementById('mainContent');
  const next = isToday ? getNextPrayer(jadwal) : null;
  const activePrayer = isToday ? getActivePrayer(jadwal) : null;

  const dateObj = new Date(currentDate + 'T00:00:00');
  const dayNames = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const dateStr = `${dayNames[dateObj.getDay()]}, ${dateObj.getDate()} ${monthNames[dateObj.getMonth()]} ${dateObj.getFullYear()}`;

  let html = `<div class="date-header"><div class="date-main">${dateStr}</div></div>`;

  if (isToday && next) {
    html += `<div class="next-prayer-card">
      <div class="next-label">${next.note ? 'Sholat Pertama Besok' : 'Sholat Berikutnya'}</div>
      <div class="next-prayer-name">${next.name}</div>
      <div class="next-prayer-time">${next.time}</div>
      <div class="next-countdown">
    <i data-lucide="clock" style="width:13px;height:13px;stroke:rgba(255,255,255,0.9);stroke-width:2.5;flex-shrink:0"></i>
        <span id="cdSpan">${next.dt ? formatCountdown(next.dt) : next.note ? 'Besok' : '—'}</span>
      </div>
    </div>`;
  }

  html += `<div class="prayers-grid">`;
  PRAYERS.forEach(p => {
    const t = jadwal[p.key]; if (!t) return;
    const isActive = activePrayer === p.key;
    html += `<div class="prayer-card ${isActive?'active-prayer':''}">
      <div class="prayer-icon" style="background:${p.bg}">
        <i data-lucide="${p.icon}" style="width:20px;height:20px;stroke:${p.color};stroke-width:1.8"></i>
      </div>
      <div class="prayer-info">
        <div class="prayer-name-en">${p.en}</div>
        <div class="prayer-name">${p.name}</div>
      </div>
      <div class="prayer-time">${t}</div>
      ${isActive ? '<div class="active-pip"></div>' : ''}
    </div>`;
  });
  html += `</div>`;

  const extras = [];
  if (jadwal.imsak) extras.push({label:'Imsak', val:jadwal.imsak});
  if (jadwal.terbit) extras.push({label:'Terbit', val:jadwal.terbit});
  if (jadwal.dhuha) extras.push({label:'Dhuha', val:jadwal.dhuha});
  if (extras.length) {
    html += `<div class="divider">
      <div class="divider-line">
        <div class="divider-ornament">❧ <i data-lucide="star" style="width:9px;height:9px;stroke:var(--gold);fill:var(--gold);stroke-width:1.5"></i> ❧</div>
      </div>
      <div class="divider-arabic">رَمَضَان الْمُبَارَك</div>
      <div class="divider-label">Waktu Ramadhan</div>
      <div class="divider-line">
        <div class="divider-ornament">❧ <i data-lucide="moon" style="width:9px;height:9px;stroke:var(--gold);fill:var(--gold);fill-opacity:0.5;stroke-width:1.5"></i> ❧</div>
      </div>
    </div><div class="prayers-grid">`;
    const extraIcons = { Imsak:'moon', Terbit:'sunrise', Dhuha:'sun-dim' };
    extras.forEach(e => {
      const ic = extraIcons[e.label] || 'moon';
      html += `<div class="prayer-card">
        <div class="prayer-icon" style="background:rgba(200,150,62,0.08)">
          <i data-lucide="${ic}" style="width:20px;height:20px;stroke:var(--gold);stroke-width:1.8"></i>
        </div>
        <div class="prayer-info"><div class="prayer-name-en">Ramadhan</div><div class="prayer-name">${e.label}</div></div>
        <div class="prayer-time">${e.val}</div>
      </div>`;
    });
    html += `</div>`;
  }

  content.innerHTML = html;
  lucide.createIcons();

  if (isToday && next?.dt) {
    countdownInterval = setInterval(() => {
      const el = document.getElementById('cdSpan');
      if (el) el.textContent = formatCountdown(next.dt);
      else clearInterval(countdownInterval);
    }, 1000);
  }
}

// ── Boot ───────────────────────────────────────────────────────────
window.onload = () => {
  lucide.createIcons();
  loadAllKota();
  initMusic();
};

// ── Music ──────────────────────────────────────────────────────────
function initMusic() {
  const audio = document.getElementById('bgAudio');
  const bar   = document.getElementById('musicBar');
  const btn   = document.getElementById('musicToggle');
  const wave  = document.getElementById('musicWave');

  Swal.fire({
    title: '<span style="font-family:Amiri,serif;font-size:1.4rem;color:#1a5c5a">🎵 Putar Musik?</span>',
    html: '<p style="font-size:0.88rem;color:#7a7060;margin:0">Ya Leel Ya Leel — Nasheed<br>akan diputar sebagai latar</p>',
    showCancelButton: true,
    confirmButtonText: 'Ya, Putar',
    cancelButtonText: 'Tidak',
    confirmButtonColor: '#1a5c5a',
    cancelButtonColor: '#c8963e',
    background: '#f5f0e8',
    borderRadius: '18px',
    customClass: { popup: 'swal-music-popup' },
    width: '320px',
  }).then(result => {
    if (result.isConfirmed) {
      audio.volume = 0.45;
      audio.play().then(() => {
        bar.style.display = 'flex';
        lucide.createIcons({ nodes: [btn] });
      }).catch(() => {});
    }
  });

  // Toggle play/pause
  btn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      updateMusicUI(true);
    } else {
      audio.pause();
      updateMusicUI(false);
    }
  });

  audio.addEventListener('play',  () => updateMusicUI(true));
  audio.addEventListener('pause', () => updateMusicUI(false));

  function updateMusicUI(playing) {
    const icon = document.getElementById('musicIcon');
    wave.className = 'music-wave' + (playing ? '' : ' paused');
    icon.setAttribute('data-lucide', playing ? 'pause' : 'play');
    lucide.createIcons({ nodes: [icon] });
  }
}
